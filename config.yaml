scenarios:
- name: naive
  charging_strategy: naive
  tractor_pv_enabled: false
  load_shedding: false
- name: night_only
  charging_strategy: night_only
  tractor_pv_enabled: false
  load_shedding: false
- name: smart
  charging_strategy: smart
  tractor_pv_enabled: false
  load_shedding: false
- name: smart_with_swap
  charging_strategy: smart_with_swap
  tractor_pv_enabled: false
  load_shedding: false
- name: pv_roof
  charging_strategy: smart
  tractor_pv_enabled: true
  load_shedding: false
- name: pv_roof_swap
  charging_strategy: smart_with_swap
  tractor_pv_enabled: true
  load_shedding: false
- name: pv_roof_shed
  charging_strategy: smart
  tractor_pv_enabled: true
  load_shedding: true
- name: full_smart
  charging_strategy: smart_with_swap
  tractor_pv_enabled: true
  load_shedding: true
- name: marl
  charging_strategy: marl
  tractor_pv_enabled: true
  load_shedding: false
  use_marl: true
scheduler:
  objective_weights:
    energy_cost: 1.0
    peak_power: 3.0
    task_delay: 2.5
    unserved_tasks: 10.0
    battery_stress: 1.0
farm:
  map:
    width_m: 800
    height_m: 500
task_generation:
  mode: generated
  num_tasks: 20
  seed: 42
  work_speed_kmh: 4.0   # in-field working speed → derives task work-distance for ROI
marl:
  enabled: true
  algorithm: rule_based
  agents:
    tractors:
      enabled: true
      charge_threshold_soc: 90
    charging_stations:
      enabled: true
    loads:
      enabled: true
      managed_priorities:
        - low
        - normal
  reward_weights:
    energy_cost: 1.0
    peak_power: 3.0
    task_completion: 10.0
    battery_stress: 1.0
prediction:
  pv:
    backend: static
    means_h:
    - 12.0
    stds_h:
    - 2.5
    weights_h:
    - 0.05
    - 10.0
    noise_frac: 0.08
  load:
    means_h:
    - 7.0
    - 13.0
    - 20.0
    stds_h:
    - 1.0
    - 2.0
    - 1.0
    weights_h:
    - 1.0
    - 5.0
    - 3.0
    - 4.0
    means_d:
    - 2.0
    stds_d:
    - 1.0
    weights_d:
    - 1.0
    - 5.0
    noise_frac: 0.1
  training:
    train_weeks: 12
    test_weeks: 5
    seed_train: 42
    seed_test: 99
    hidden_units:
    - 50
    epochs: 2000
    dropout: null

# ── Vehicle-to-Load (V2L) ──────────────────────────────────────────────────────
# Tractors docked at chargers can reverse-discharge to supply farm loads when the
# grid is overloaded or unavailable.  The bidirectional charger acts as an inverter.
v2l:
  enabled: true
  min_soc_pct: 35.0         # never discharge below this threshold
  max_discharge_kw: 6.6     # per tractor (bidirectional charger rated power)
  trigger_overload_kw: 0.5  # activate when (farm_load - PV - grid_cap) > this

# Set to false to run all scenarios without any mid-day disruptions.
dynamic_events_enabled: true

# Dynamic plan-change events injected during the simulation day.
# All scenarios run the same events so reactions can be compared across strategies.
dynamic_events:
- at: '2026-06-01 06:30:00'
  type: power_outage
  label: 'Grid outage - V2L active'
- at: '2026-06-01 07:30:00'
  type: grid_restore
  label: 'Grid restored after outage'
- at: '2026-06-01 10:00:00'
  type: task_inject
  label: 'Urgent spray injected'
  task:
    name: 'Emergency sprayer B'
    priority: urgent
    location: {x: 620, y: 310}
    duration_minutes: 35
    distance_km: 1.8
    uses_pto: true
    pto_power_kw: 7.5
- at: '2026-06-01 13:30:00'
  type: tractor_offline
  label: 'Tractor 2 breakdown'
  tractor_id: tractor_2
- at: '2026-06-01 16:00:00'
  type: grid_reduce
  label: 'Grid cap reduced to 7 kW'
  new_max_kw: 7.0
- at: '2026-06-01 18:00:00'
  type: grid_restore
  label: 'Grid cap restored'

# ── ROI & Investment analysis ──────────────────────────────────────────────────
# Long-term return-on-investment model for the main HARVEST investments.
#
# The economic values below are DEMONSTRATION ASSUMPTIONS — illustrative figures
# chosen so the ROI dashboard shows meaningful numbers out of the box. They are
# NOT current market prices, supplier quotations or verified operating data.
# Replace every figure with supplier quotations and local operating data before
# making an investment decision. Override any value in config.local.yaml.
#
# Operational values (fleet size, PV capacity, chargers, tasks, seed, tariffs,
# scenarios, …) are NOT set here — ROI always takes them from the latest
# successful Operations simulation run.
roi:
  enabled: true
  demonstration_assumptions: true     # true → dashboard labels the figures as demo

  analysis:
    period_mode: auto                 # exact | representative_month | auto
    auto_exact_max_days: 90           # auto uses exact daily up to this many days
    representative_days_per_month: 1  # days simulated per covered month (rep. mode)
    default_start_date: "2026-01-01"
    default_end_date: "2026-12-31"
    financial_horizon_years: 10
    currency: EUR
    base_seed: 42                     # daily_seed = base_seed + YYYYMMDD
    # NOTE: no `scenario` here — ROI evaluates every scenario from the Operations run.

  financial:
    discount_rate_pct: 6.0
    general_cost_escalation_pct: 2.0
    electricity_price_escalation_pct: 2.5
    diesel_price_escalation_pct: 3.0
    maintenance_escalation_pct: 2.0

  service_value:
    uncompleted_task_cost_eur: 0.0
    downtime_cost_eur_per_hour: 0.0

  electric_fleet:
    electric_tractor_purchase_eur_each: 120000    # € per electric tractor
    diesel_equivalent_purchase_eur_each: 90000    # € per equivalent diesel tractor
    electric_maintenance_eur_per_hour: 3.5        # € per operating hour
    charger_capex_eur_each: 7500                  # € per charger
    charger_installation_eur_each: 2500           # € per charger
    grant_eur_total: 0                            # € total subsidy for the fleet+chargers
    residual_value_eur_each: 20000               # € per electric tractor at horizon end
    battery_replacement_year: 10                  # replace traction battery in this year
    battery_replacement_eur_each: 25000           # € per tractor

  diesel:
    fuel_price_eur_per_litre: 1.55
    travel_litres_per_100km: 18.0
    pto_litres_per_hour: 8.0
    idle_litres_per_hour: 2.0
    maintenance_eur_per_hour: 7.0
    co2_kg_per_litre: 2.68

  farm_pv:                            # installed kWp comes from Operations
    capex_eur_per_kwp: 950
    fixed_installation_eur: 2500
    annual_om_pct_of_capex: 1.0
    annual_om_eur: 0.0
    annual_degradation_pct: 0.5
    feed_in_tariff_eur_per_kwh: 0.06
    export_surplus_enabled: false
    grant_eur: 0
    inverter_replacement_year: 10
    inverter_replacement_eur: 3000
    residual_value_eur: 0
    lifetime_years: 25

  tractor_roof_pv:                    # panel W and equipped-tractor count come from Operations
    capex_eur_per_tractor: 1500
    installation_eur_per_tractor: 500
    annual_om_eur_per_tractor: 40
    annual_degradation_pct: 0.5
    replacement_year: 10
    replacement_eur_per_tractor: 600
    grant_eur: 0
    equipped_tractors: null           # null → count tractors with has_pv_roof
    residual_value_eur: 0

  outages:                            # disabled by default, but demo assumptions populated
    enabled: false
    frequency_per_year: 1.5
    average_duration_hours: 3.0
    value_of_lost_load_eur_per_kwh: 4.0
    downtime_cost_eur_per_hour: 100
    task_disruption_cost_eur_per_hour: 50
    islanding_enabled: false
    critical_load_kw: 3.0
    backup_battery_kwh: 50
    backup_battery_usable_pct: 80
    backup_reserve_soc_pct: 10.0
    backup_max_power_kw: 10
    v2l_enabled: false
    v2l_min_tractor_soc_pct: 30
    islanding_capex_eur: 6000
    backup_capex_eur: 20000
    grant_eur: 0
    seed: 42

  sensitivity:
    enabled: true
    variation_pct: 20.0
