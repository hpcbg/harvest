scenarios:
- name: naive
  charging_strategy: naive
  tractor_pv_enabled: false
  load_shedding: false
- name: night_only
  charging_strategy: night_only
  tractor_pv_enabled: false
  load_shedding: false
- name: smart
  charging_strategy: smart
  tractor_pv_enabled: false
  load_shedding: false
- name: smart_with_swap
  charging_strategy: smart_with_swap
  tractor_pv_enabled: false
  load_shedding: false
- name: pv_roof
  charging_strategy: smart
  tractor_pv_enabled: true
  load_shedding: false
- name: pv_roof_swap
  charging_strategy: smart_with_swap
  tractor_pv_enabled: true
  load_shedding: false
- name: pv_roof_shed
  charging_strategy: smart
  tractor_pv_enabled: true
  load_shedding: true
- name: full_smart
  charging_strategy: smart_with_swap
  tractor_pv_enabled: true
  load_shedding: true
