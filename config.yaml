    end: 08:00
- id: irrigation_pump_evening
  power_kw: 3.0
  priority: high
  schedule:
    start: '19:00'
    end: '21:00'
- id: barn_doors_motors
  power_kw: 0.5
  priority: normal
  schedule:
    start: 07:00
    end: 08:00
- id: cold_storage
  power_kw: 1.2
  priority: high
  schedule:
