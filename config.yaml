- id: electric_fence
  power_kw: 0.2
  priority: critical
  always_on: true
- id: irrigation_pump_morning
  power_kw: 3.0
  priority: high
  schedule:
    start: 06:00
    end: 08:00
- id: irrigation_pump_evening
  power_kw: 3.0
  priority: high
  schedule:
    start: '19:00'
    end: '21:00'
- id: barn_doors_motors
  power_kw: 0.5
  priority: normal
  schedule:
    start: 07:00
    end: 08:00
- id: cold_storage
  power_kw: 1.2
  priority: high
  schedule:
    start: 08:00
    end: '20:00'
- id: workshop_tools
  power_kw: 2.5
  priority: normal
  schedule:
    start: 08:00
    end: '17:00'
- id: office_hvac
  power_kw: 1.5
  priority: low
  schedule:
    start: 08:00
    end: '18:00'
- id: outdoor_lighting
  power_kw: 0.8
  priority: normal
  schedule:
