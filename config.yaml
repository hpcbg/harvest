      intervals:
      - start: '10:00'
        end: '14:00'
      - start: '18:00'
        end: '22:00'
      price_eur_per_kwh: 0.2
    llano:
      intervals:
      - start: 08:00
        end: '10:00'
      - start: '14:00'
        end: '18:00'
      - start: '22:00'
        end: 00:00
      price_eur_per_kwh: 0.17
