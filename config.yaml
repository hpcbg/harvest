  priority: normal
  schedule:
    start: 08:00
    end: '17:00'
- id: office_hvac
  power_kw: 1.5
  priority: low
  schedule:
    start: 08:00
    end: '18:00'
- id: outdoor_lighting
  power_kw: 0.8
  priority: normal
  schedule:
    start: '20:00'
    end: '23:00'
- id: security_lighting
  power_kw: 0.3
  priority: critical
  schedule:
    start: '22:00'
